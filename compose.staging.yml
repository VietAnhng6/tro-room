services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tro_room
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - staging_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tro_room"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: tro-room-backend:s4-10
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: staging
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tro_room
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      DEMO_SEED_ENABLED: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD}
    volumes:
      - staging_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: tro-room-frontend:s4-10
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8088:80"
    depends_on:
      - backend

volumes:
  staging_db:
  staging_uploads: